<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>인터랙션 100개 부수기</title>
<style>
html,body{margin:0;background:#FAF8F2}
.wr{position:relative;width:100%}
.wr iframe{position:sticky;top:0;display:block;border:0;background:transparent;transform-origin:0 0}
.totop{position:fixed;right:20px;bottom:20px;width:44px;height:44px;box-sizing:border-box;border:0;border-radius:50%;background:#111111;color:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;z-index:999;opacity:0;visibility:hidden;transform:translateY(8px) scale(1);box-shadow:0 4px 14px rgba(0,0,0,.18);transition:opacity .25s ease-out,transform .2s ease-out,background-color .15s ease-out,box-shadow .2s ease-out,visibility 0s linear .25s}
.totop.on{opacity:1;visibility:visible;transform:translateY(0) scale(1);transition:opacity .25s ease-out,transform .2s ease-out,background-color .15s ease-out,box-shadow .2s ease-out,visibility 0s}
.totop.on:hover{background:#3A3D43;transform:translateY(-2px) scale(1.06);box-shadow:0 8px 20px rgba(0,0,0,.24)}
.totop.on:active{background:#000000;transform:translateY(0) scale(.92);box-shadow:0 2px 8px rgba(0,0,0,.2);transition-duration:.08s}
</style></head><body>

: p; this._bs = Object.assign({}, this._bs, patch); this.$h.setState({ $b: this._bs }, cb); }\n\n_prompts() { return {\"1\":{\"t\":\"아이콘 넛지\",\"r\":[[\"오브젝트\",\"가로로 긴 검정 버튼 안, '작품 보러가기' 텍스트 옆에 → 화살표(새로 생성).\"],[\"트리거\",\"버튼 위에 마우스를 올렸을 때.\"],[\"반응\",\"화살표가 오른쪽으로 이동하고, 마우스를 내리면 원래 위치로 복귀. 이징은 ease in-out.\"],[\"수정\",\"· 버튼을 텍스트를 감쌀 크기로 줄이고 양 끝이 반원인 pill 형태로 변경, 전체 크기 20% 축소\\n· 화살표 이동 거리 10pt → 5pt\\n· 모든 인터랙션 왼쪽 상단에 번호와 타이틀을 작은 회색 글씨로 표기\"]]},\"2\":{\"t\":\"마그네틱 버튼\",\"r\":[[\"오브젝트\",\"'이끌리는 버튼' 텍스트가 들어간 검정 버튼.\"],[\"트리거\",\"마우스가 버튼 주변에 접근할 때.\"],[\"반응\",\"버튼이 마우스를 향해 움직이며 따라옴.\"],[\"조건\",\"감지 범위는 버튼 주변 15pt로 제한, 이동 거리도 15pt를 넘지 않음.\"],[\"수정\",\"· 따라갈 때는 ease out, 원위치로 돌아올 때는 spring 적용\\n· 감지 범위는 유지하되, 따라갈 수 있는 범위는 #2 캔버스 영역 전체로 확대\\n· 복귀 조건: 마우스가 버튼에서 빠르게 멀어지거나 범위를 벗어날 때\\n· 버튼은 마우스 이동 거리에 비례해 버튼 주변 40pt 안에서만 이동\\n· 마우스 속도 기준을 높여 더 쫀쫀하게 붙도록 조정, spring 효과 강화\"]]},\"3\":{\"t\":\"블러 투 포커스\",\"r\":[[\"오브젝트\",\"'흐릿했던 문장이 선명해진다' 문장.\"],[\"트리거\",\"글자 위에 마우스를 올렸을 때.\"],[\"반응\",\"블러가 사라지고, 마우스를 내리면 다시 블러 처리. 이징은 ease out.\"]]},\"4\":{\"t\":\"호버 줌\",\"r\":[[\"오브젝트\",\"좌우로 나란히 놓인 모서리가 둥근 카드 2장(금색·은색, 둘 다 좌측 상단 빛 그라데이션).\"],[\"트리거\",\"각 카드에 마우스를 올렸을 때.\"],[\"반응\",\"올린 카드가 줌인되며 내부에 '#1', '#2' 글자가 나타남. 글자는 카드 왼쪽 하단에서 위로 올라오며 opacity가 함께 증가하고, 마우스를 내리면 줌아웃되며 내려가면서 사라짐. 줌 이징은 ease out, 글자는 흰색 약 7pt.\"],[\"수정\",\"· 카드 세로 길이를 가로 길이보다 살짝 짧게 조정\"]]},\"5\":{\"t\":\"애니메이티드 언더라인\",\"r\":[[\"오브젝트\",\"'포트폴리오', '소개', '연락' 텍스트가 한 줄로 나열.\"],[\"트리거\",\"각 텍스트에 마우스를 올렸을 때.\"],[\"반응\",\"텍스트 아래에 왼쪽에서 오른쪽으로 언더라인이 그려지고, 마우스를 내리면 다시 왼쪽으로 사라짐. ease out 적용, 두께 2pt.\"],[\"수정\",\"· 언더라인 두께를 1pt로 조정\\n· 선이 오른쪽 끝까지 찼을 때 두께가 다시 2pt로 돌아가는 문제 수정\"]]},\"6\":{\"t\":\"커스텀 커서\",\"r\":[[\"오브젝트\",\"#6 인터랙션 범위에 해당하는 캔버스 영역.\"],[\"트리거\",\"마우스가 범위 안에서 움직일 때.\"],[\"반응\",\"기본 커서를 흰 원(희미한 회색 아웃라인)으로 교체해 마우스를 실시간으로 따라가게 함. 범위에 들어올 때 opacity를 ease out으로 나타내고, 나갈 때도 같은 방식으로 사라지게 함.\"],[\"수정\",\"· 커서 크기를 지름 30pt 원으로 변경\"]]},\"7\":{\"t\":\"머물면 뜨는 정보카드\",\"r\":[[\"오브젝트\",\"넓은 사각형 카드 안에 '공지 · 오늘 오전 10:12'(작은 회색)와 이어지는 본문 '이번 주 회의는 김서연님이 진행하고, 발표 자료는 박도윤님이 정리해서 공유할 예정입니다. 질문은 금요일까지 남겨 주세요.'(일반 크기). '김서연'과 '박도윤'은 볼드·언더라인·파란 글씨.\"],[\"트리거\",\"'김서연' 또는 '박도윤'에 마우스를 올렸을 때.\"],[\"반응\",\"0.3초 딜레이 후 해당 이름 위에 말풍선 카드가 나타남. 아래에서 위로 스케일 0→100, 통통 튀는 spring 이징. 카드 안에는 상단에 이름이 들어간 원형 프로필, 오른쪽에 큰 성/이름과 그 아래 회색 '프로덕트 디자이너', 하단에 '모바일 결제 흐름과 온보딩 화면을 맡고 있어요' 설명. 마우스를 떼면 ease in으로 원상복귀.\"]]},\"8\":{\"t\":\"스태거 리빌\",\"r\":[[\"오브젝트\",\"모서리가 둥근 사각형 카드 3장.\"],[\"트리거\",\"스크롤을 내려 카드가 화면 중앙에 가까워질 때.\"],[\"반응\",\"카드가 아래에서 위로 올라오며 opacity 0→100. ease out, 왼쪽부터 0.2초 간격으로 순차 등장. 오른쪽 상단(타이틀 반대편)에 스크롤을 이미 내린 상태에서도 다시 확인할 수 있는 작은 '다시보기' 버튼 배치.\"],[\"수정\",\"· 카드 세로 길이를 가로보다 짧게 조정 (이후 카드는 항상 이 비율로 생성)\\n· 아래쪽 여백 소폭 축소\"]]},\"9\":{\"t\":\"패럴랙스\",\"r\":[[\"오브젝트\",\"범위를 가득 채우는 뒷면 레이어(대각선 흰색·회색 줄무늬)와, 검정 버튼 형태로 '앞면 레이어'라고 적힌 앞면 레이어.\"],[\"트리거\",\"스크롤할 때.\"],[\"반응\",\"앞면 레이어는 스크롤 속도대로 움직이고, 뒷면 레이어는 더 느리게 움직여 두 층이 분리되어 보이게 함.\"],[\"수정\",\"· 효과가 잘 보이도록 줄무늬를 더 두껍게, 스크롤 움직임에 ease out 적용\\n· 느려진 속도에 맞춰 뒷면의 이동 거리도 더 줄임\"]]},\"10\":{\"t\":\"스크롤 프로그레스\",\"r\":[[\"오브젝트\",\"가로:세로 10:8 비율의 텍스트 박스. 안에는 스크롤 프로그레스의 원리와 용도를 설명하는 여러 문단이 들어 있음('이 상자 안에서 스크롤해 보세요…' ~ '끝까지 내리면 줄이 꽉 찹니다').\"],[\"트리거\",\"박스 위에 마우스를 올리고 스크롤할 때.\"],[\"반응\",\"스크롤을 내리면 박스 위쪽 모서리에 왼쪽부터 진행선이 차오르고, 오른쪽에는 스크롤 인디케이터 표시. ease out 적용.\"],[\"수정\",\"· 텍스트 상자 세로 비율 축소, 가로 길이 10% 축소(가운데 기준)\\n· #9와 #10 사이 간격 축소\"]]},\"11\":{\"t\":\"마스크드 텍스트 리빌\",\"r\":[[\"오브젝트\",\"'문장이 줄 단위로, / 아래에서 걷히듯, / 차례로 나타난다.' 3줄 텍스트.\"],[\"트리거\",\"스크롤할 때.\"],[\"반응\",\"스크롤 범위에 따라 한 줄씩 아래에서 위로 나타남.\"],[\"수정\",\"· '다시보기' 버튼 추가\\n· 타이틀과 내용 사이 간격을 절반으로 축소\"]]},\"12\":{\"t\":\"스크롤 피닝\",\"r\":[[\"오브젝트\",\"인터랙션 범위를 거의 채우는 사각형 카드.\"],[\"트리거\",\"페이지를 스크롤할 때.\"],[\"반응\",\"처음에는 아이보리 배경에 '1단계 - 계속 스크롤', 1/3 지점을 지나면 민트색 배경에 '2단계 - 색이 바뀌고', 3단계에서는 검정 배경·흰 글씨로 '3단계 - 완료!'로 변경.\"],[\"조건\",\"카드와 타이틀을 포함한 인터랙션 범위가 화면 중앙에 닿으면 3단계에 이를 때까지 중앙에 머무름(페이지는 계속 스크롤). 일반 인터랙션 범위의 약 6배 영역 할당.\"],[\"수정\",\"· 고정 방식을 스크롤 속도에 맞춰 범위가 함께 아래로 이동하는 방식으로 바꿔 떨림 방지\\n· 오타 수정('색이 바뀌고')\\n· 아트보드 하단까지 가능한 한 넓은 범위 부여\"]]},\"13\":{\"t\":\"오토하이드 헤더\",\"r\":[[\"오브젝트\",\"#10과 같은 텍스트 상자(스크롤 프로그레스 바 없음). 상자 상단에 '헤더'라고 적힌 헤더 박스. 본문은 오토하이드 헤더의 원리를 설명하는 문단들('이 상자 안에서 아래로 내려 보세요 — 위 헤더가 숨습니다.' ~ '지금 위로 올려 보세요.').\"],[\"트리거\",\"텍스트 상자 안에서 스크롤할 때.\"],[\"반응\",\"아래로 스크롤하면 헤더가 위로 올라가 숨고, 위로 스크롤하면 다시 내려와 나타남. ease out 적용.\"]]},\"14\":{\"t\":\"드래그 캐러셀\",\"r\":[[\"오브젝트\",\"범위 안에 사각형 카드 5장(가운데에 1~5 숫자, 파스텔 톤 랜덤 색상). 1번부터 왼쪽에 정렬하고, 3번은 오른쪽 경계에 걸쳐 보이며 4·5번은 범위 밖에 있어 보이지 않음.\"],[\"트리거\",\"카드가 놓인 영역을 잡고 드래그할 때.\"],[\"반응\",\"카드들이 함께 좌우로 이동해 5번 카드까지 확인할 수 있음. 1번이 맨 왼쪽, 5번이 맨 오른쪽에 올 때까지만 이동 가능.\"],[\"조건\",\"한계에 닿으면 경계 저항 구현.\"]]},\"15\":{\"t\":\"비포/애프터\",\"r\":[[\"오브젝트\",\"좌우를 꽉 채우는 사각형 카드. 중앙에 세로선 핸들이 있고, 핸들 왼쪽은 포레스트 그린, 오른쪽은 버건디.\"],[\"트리거\",\"핸들을 잡고 좌우로 드래그할 때.\"],[\"반응\",\"핸들 위치에 따라 영역이 조정되어, 핸들 왼쪽은 그린, 오른쪽은 버건디로 채워짐.\"],[\"조건\",\"핸들은 카드 좌우 최대 97% 위치까지만 이동 가능.\"],[\"수정\",\"· 핸들 표시를 지우고 선 자체가 핸들로 동작하게 변경\\n· 두 색을 파스텔 톤으로 교체\\n· 카드 양 끝이 범위에서 살짝 떨어지도록 하고 모서리를 둥글게 처리\"]]},\"16\":{\"t\":\"로터리 다이얼\",\"r\":[[\"오브젝트\",\"중심에 검정 원형 다이얼과 그 위의 짧은 흰색 인디케이터. 다이얼 주변에는 6등분된 회색 위치 인디케이터. 다이얼 오른쪽에는 '작품 1' 텍스트.\"],[\"트리거\",\"다이얼을 드래그할 때.\"],[\"반응\",\"다이얼이 회전하며 인디케이터가 위치 인디케이터에 맞춰짐. 드래그를 놓으면 가장 가까운 위치로 ease out 스냅. 맨 위에서 시계 방향으로 1~6이 되며 '작품' 뒤 숫자가 바뀌고, 드래그 중에도 가장 가까운 위치 기준으로 숫자가 변경됨.\"],[\"수정\",\"· 가장 가까운(선택된) 위치 인디케이터는 살짝 더 두꺼운 검정 선으로 표시\"]]},\"17\":{\"t\":\"드래그 앤 드롭 정렬\",\"r\":[[\"오브젝트\",\"좌우로 길고 위아래로 짧은 회색 카드 3개('첫번째 항목', '두번째 항목', '세번째 항목')가 세로로 정렬.\"],[\"트리거\",\"카드를 집어 드래그할 때.\"],[\"반응\",\"집은 카드가 살짝 줌인되고 drop shadow로 떠 있는 느낌을 줌. 위아래로 움직이면 다른 카드들이 따라 재정렬되어 순서를 바꿀 수 있음. 레이아웃은 초기와 동일하게 유지하고 순서만 변경, 드래그 중인 카드는 맨 앞에 표시.\"]]},\"18\":{\"t\":\"슬라이더 매핑\",\"r\":[[\"오브젝트\",\"왼쪽에 밝은 노란색으로 채워진 원, 오른쪽에 흰색/검정 슬라이더.\"],[\"트리거\",\"슬라이더 핸들을 잡고 좌우로 움직일 때.\"],[\"반응\",\"슬라이더에 따라 원의 조도가 변하고, 슬라이더 왼쪽은 검정이 차오르며 오른쪽은 흰색으로 보임.\"],[\"수정\",\"· 조도가 바뀌는 방향을 반대로 변경\\n· 원 주변 glow 이펙트 제거, 노란색을 더 낮은 채도로 변경\"]]},\"19\":{\"t\":\"컨디셔널 스테이트\",\"r\":[[\"오브젝트\",\"위와 같은 슬라이더를 배치하고 왼쪽에 '준비' 텍스트.\"],[\"트리거\",\"슬라이더를 잡고 드래그할 때.\"],[\"반응\",\"1/3 지점을 넘으면 '익는 중', 2/3 지점을 넘으면 '완성'으로 변경. 새 글자는 아래에서 위로 올라오며 opacity 0→100, 모두 ease out.\"],[\"수정\",\"· 왼쪽으로 돌아갈 때도 글자가 나타나는 방식은 동일하게 유지\\n· 기존 글자는 duration 없이 즉시 사라지도록 변경\"]]},\"20\":{\"t\":\"테마 토글\",\"r\":[[\"오브젝트\",\"'지금 테마 · 라이트' 텍스트와 오른쪽 스위치, 두 요소를 감싸는 밝은 회색 카드.\"],[\"트리거\",\"스위치를 토글할 때.\"],[\"반응\",\"카드가 검정으로, 텍스트가 흰색으로 바뀌고 '라이트'가 '다크'로 변경. 카드 폭은 텍스트 길이에 따라 자동 조정되며 ease out, 텍스트는 opacity가 서서히 변함.\"],[\"수정\",\"· 라이트 테마 느낌이 나도록 밝은 회색에 약간의 노란 톤 추가\"]]},\"21\":{\"t\":\"프로그레스 게이지\",\"r\":[[\"오브젝트\",\"좌우로 프로그레스 바와 슬라이더를 배치하고, 가운데에 바가 채워진 비율만큼의 숫자 표시.\"],[\"트리거\",\"슬라이더를 잡고 드래그할 때.\"],[\"반응\",\"프로그레스 바가 슬라이더에 맞춰 채워지거나 비워지고, 숫자는 0~100으로 변경. 변화에 ease out 적용.\"]]},\"22\":{\"t\":\"프리셋 리콜\",\"r\":[[\"오브젝트\",\"슬라이더 2개를 위아래로 배치하고 각각 왼쪽에 작은 '온도', '시간' 텍스트, 오른쪽에 채움 비율(%). 슬라이더 아래에 '세팅 1', '세팅 2' 버튼, 그 아래 작은 안내 문구 '기본 프리셋이 들어 있어요 — 탭해 보세요'. 우측 상단에는 타이틀과 같은 스타일로 '길게 누르면 저장 · 탭하면 불러오기'.\"],[\"트리거\",\"슬라이더 드래그 / 버튼 탭 / 버튼 길게 누르기.\"],[\"반응\",\"드래그하면 오른쪽 숫자가 백분율로 변함. 버튼을 탭하면 저장된 값으로 슬라이더가 이동(세팅 1: 온도 80·시간 20, 세팅 2: 온도 60·시간 35)하며 문구가 '세팅 N 불러오는 중 — 슬라이더가 움직여요'로 변경. 버튼을 길게 누르면 현재 슬라이더 위치가 해당 세팅 값으로 새로 저장되고 문구가 '세팅 N에 저장했어요'로 변경.\"],[\"수정\",\"· 세팅 1·2 버튼 색상을 옅은 노란색, 텍스트는 검정으로 변경\"]]},\"23\":{\"t\":\"푸시 트랜지션\",\"r\":[[\"오브젝트\",\"세로로 긴 카드. 상단에 '내 작품' 헤더, 그 아래 '작품 1', '작품 2', '작품 3' 항목이 얇은 선으로 구분되어 세로 정렬. 헤더를 제외한 항목 옆에는 작은 화살표.\"],[\"트리거\",\"화살표 또는 화살표가 붙은 항목을 탭할 때.\"],[\"반응\",\"카드가 옆으로 넘어가며 헤더가 탭한 항목 이름으로 바뀜. 헤더 왼쪽에 뒤로가기 화살표가 생겨 누르면 이전 화면으로 복귀. 상세 화면은 중앙에 다른 색의 작은 사각형 카드, 그 아래 'push 전환으로 들어온 상세화면' 텍스트.\"]]},\"24\":{\"t\":\"바텀 시트\",\"r\":[[\"오브젝트\",\"사각형 카드, 중앙에 '시트 열기' 텍스트의 검정 버튼. 카드 하단에는 shadow 그라데이션.\"],[\"트리거\",\"'시트 열기' 버튼을 탭할 때.\"],[\"반응\",\"아래에서 바텀 시트가 올라와 화면의 60%를 덮음. 패널에는 굵은 '아래서 올라온 커버'와 얇은 '핸들을 탭하면 닫혀요'. shadow 그라데이션도 시트와 함께 올라오고, 시트 상단 중앙의 선 모양 핸들을 탭하면 시트가 아래로 내려가 닫힘.\"],[\"수정\",\"· 카드 윤곽선이 살짝 보이도록 수정\"]]},\"25\":{\"t\":\"슬라이딩 탭 인디케이터\",\"r\":[[\"오브젝트\",\"가로로 긴 '홈 / 보관함 / 설정' 탭. 처음에는 '홈' 위에 검정 선 인디케이터.\"],[\"트리거\",\"탭 안의 각 텍스트를 탭할 때.\"],[\"반응\",\"탭한 텍스트 위쪽으로 선 인디케이터가 이동. 각 탭 영역은 텍스트 길이에 따라 배정하고, 인디케이터 길이도 영역에 맞춰 조정. ease in-out 적용.\"],[\"수정\",\"· 탭 전체를 사각형 카드로 감싸 중앙에 배치\\n· 카드 색과 인디케이터가 선택되지 않은 부분의 색을 통일하고, 카드 모서리 둥글기 감소\"]]},\"26\":{\"t\":\"카드 플립 시퀀스\",\"r\":[[\"오브젝트\",\"'스', '마', '트', '인', '터' 글자별 작은 아이보리 사각형 카드를 수평 정렬하고, 맨 오른쪽에 모서리를 더 둥글게 한 버튼 모양의 '재생' 카드(아이보리).\"],[\"트리거\",\"'재생' 버튼을 탭할 때.\"],[\"반응\",\"왼쪽부터 각 카드가 위아래로 2바퀴 뒤집히며 검정으로 변함. 카드별 0.2초 딜레이(재생 카드 제외). 모든 카드가 바뀌고 2초 뒤 전부 동시에 원래 색으로 복귀.\"],[\"수정\",\"· 원상태로 돌아가는 duration을 0.5초로 증가\"]]},\"27\":{\"t\":\"와이프 트랜지션\",\"r\":[[\"오브젝트\",\"범위의 절반 정도 크기의 아이보리 사각형 카드('화면 1' 텍스트)와, 카드 옆의 아이보리 '전환' 버튼.\"],[\"트리거\",\"'전환' 버튼을 탭할 때.\"],[\"반응\",\"카드 왼쪽에서 오른쪽으로 검정이 와이프되어 채워지고, 다 채워지면 검정이 0.2초 동안 opacity 0으로 사라지며 '화면 2'가 나타남. 다시 누르면 같은 방식으로 '화면 1'로 복귀.\"]]},\"28\":{\"t\":\"버튼이 펼쳐지는 메뉴\",\"r\":[[\"오브젝트\",\"범위 대부분을 덮는 사각형 카드. 좌측 상단에 큰 '스케치 내용 정리' 텍스트와 다양한 요소들이 있고, 우측 상단에는 텍스트 크기 정도의 원형 버튼(가운데 가로 점 3개).\"],[\"트리거\",\"원형 버튼을 탭할 때.\"],[\"반응\",\"버튼에서 시작해 버튼을 가리며 왼쪽 아래로 사각형 메뉴 카드가 펼쳐짐. 메뉴는 '이름 바꾸기', '공유', '복제', '보관', '삭제'가 세로로 나열되고 각 텍스트 앞에 아이콘이 있으며, 삭제 메뉴와 아이콘은 빨간색. 메뉴와 버튼은 마우스를 올리면 색이 진해짐. 메뉴를 클릭하거나 카드 바깥을 탭하면 다시 접힘.\"],[\"수정\",\"· 버튼 클릭이 동작하지 않는 문제 수정\\n· '컬러' 오타 수정, 추가 요소들의 색상은 회색으로 통일\"]]},\"29\":{\"t\":\"펼침·접힘 목록\",\"r\":[[\"오브젝트\",\"넓은 사각형 카드. 카드 바깥 왼쪽 위에 큰 '자주 묻는 질문'. 카드 안에는 '수업 자료는 어디서 받나요?', '과제 제출 기한을 넘기면 어떻게 되나요?', '팀은 어떻게 정하나요?', '노트북이 꼭 필요한가요?', '결석하면 보강이 있나요?' 5개 메뉴가 세로로 나열되고 각 항목 오른쪽 끝에 V자 화살표.\"],[\"트리거\",\"각 메뉴를 탭할 때.\"],[\"반응\",\"메뉴 텍스트와 화살표가 파란색으로 바뀌고 화살표는 위아래로 뒤집힘. 메뉴가 아래로 늘어나며 질문에 대한 답변(임의 작성)이 약간 작은 회색 글씨로 표시됨.\"],[\"조건\",\"한 번에 하나의 메뉴만 열림. 열려 있는 메뉴를 다시 탭하면 원래대로 닫힘.\"]]},\"30\":{\"t\":\"풀 투 리프레시\",\"r\":[[\"오브젝트\",\"세로로 긴 좁은 사각형 카드. 안에 '메세지 1' ~ '메세지 4'가 메뉴 형식으로 세로 배치.\"],[\"트리거\",\"카드를 드래그해 아래로 당길 때.\"],[\"반응\",\"당기는 만큼 카드 상단에 회색 배경이 내려오고 회전 화살표가 opacity와 함께 나타남. 더 당길수록 화살표가 시계 방향으로 회전. 메뉴 한 칸 높이 이상 당긴 뒤 놓으면 상단 배경이 한 칸 높이로 맞춰져 1초간 유지되고 화살표가 빠르게 한 바퀴 돈 뒤 영역이 다시 닫힘.\"],[\"수정\",\"· 메뉴는 누르는 동안에만 배경색보다 살짝 밝은 회색으로 변경\\n· 화살표는 직선 화살표가 아닌 ↻ 모양으로 변경\\n· 회전 화살표는 놓은 시점부터 한 바퀴 회전(Rotate to가 아닌 Rotate by)\"]]},\"31\":{\"t\":\"파티클 버스트\",\"r\":[[\"오브젝트\",\"화면 중앙의 작은 입체감 있는 흰색 하트.\"],[\"트리거\",\"하트를 탭할 때.\"],[\"반응\",\"하트가 빨간색으로 바뀌며 스케일이 spring으로 잠시 커졌다 줄어듦. 빨간색으로 바뀔 때 중앙에서 빨간 링이 퍼져나가고, 링과 함께 작은 하트 9개가 바깥으로 뻗어나감. 링과 하트는 opacity 약 60%. 다시 탭하면 흰색 하트로 돌아가며 링과 하트 효과는 생략.\"],[\"수정\",\"· 링 두께 약 10px, 퍼져나가는 효과 구현 수정\\n· 링 최종 지름을 절반 정도로 축소, 하트는 더 키우고 링과 같은 지점에서 시작해 링보다 20px 더 이동\\n· 링은 처음에 얇다가 퍼지며 두꺼워지도록 변경\\n· 하트 자체의 회전 각도를 좌우 ±30° 내에서 랜덤하게, 크기도 ±15% 범위에서 조금씩 다르게\\n· 퍼져나가는 거리도 ±10px 범위에서 조금씩 다르게\"]]},\"32\":{\"t\":\"스켈레톤 UI\",\"r\":[[\"오브젝트\",\"범위 안에 굵은 '로딩이 끝난 진짜 제목'과 가는 '본문 내용이 여기 들어갑니다'를 위아래로 배치하고, 오른쪽에 아이보리 '새로고침' 버튼.\"],[\"트리거\",\"버튼을 탭할 때.\"],[\"반응\",\"텍스트 레이아웃을 보여주는 둥근 박스 2개가 딜레이 없이 3초간 나타남. 3초 후 박스는 빠르게 사라지고 기존 텍스트가 각 줄별로 아래에서 위로 올라오며 나타남. 박스 안에는 로딩 표시로 색이 조금씩 변하는 wave 효과.\"]]},\"33\":{\"t\":\"스와이프 액션\",\"r\":[[\"오브젝트\",\"'밀 수 있는 셀' 텍스트가 들어간, 가로로 길고 위아래는 텍스트를 감쌀 정도인 회색 사각형 카드.\"],[\"트리거\",\"카드를 왼쪽 또는 오른쪽으로 드래그할 때.\"],[\"반응\",\"왼쪽으로 드래그하면 오른쪽 끝에서 빨간 영역이 나오고, 당기는 만큼 '삭제' 텍스트의 opacity가 올라 텍스트 폭을 넘으면 100%. 반대로 당기면 같은 반응으로 왼쪽에서 파란 영역과 '보관' 텍스트.\"],[\"조건\",\"당긴 정도가 절반 이하면 텍스트가 보일 만큼만 고정, 절반 이상이면 카드가 완전히 넘어가며 색으로 가득 참(텍스트를 탭해도 동일). 이후 3초 뒤 원상 복귀.\"],[\"수정\",\"· 살짝 밀린 상태에서 다시 원래 위치로 밀면 초기 상태로 복귀\\n· 가득 찬 뒤 복귀는 opacity가 아니라 카드 아래 모서리가 위로 올라오며 사라지는 방식: 0.5초 사라짐 → 2초 유지 → 0.5초 나타남, ease out\\n· 드래그가 끊기고 버벅이는 느낌 개선\"]]},\"34\":{\"t\":\"시간 경과 상태 변화\",\"r\":[[\"오브젝트\",\"왼쪽에 밝고 낮은 채도의 노란 원, 그 옆에 굵은 '설정하세요'와 그 아래 작고 얇은 회색 '0%'. 범위 오른쪽에 검정 '시작' 버튼.\"],[\"트리거\",\"버튼을 탭할 때.\"],[\"반응\",\"원의 색이 조금씩 갈색으로 변하고 퍼센트가 실시간으로 올라감(초당 12%p). 텍스트는 '굽는 중' → 33% '익어가는 중' → 66% '거의 다 됐어요' → 100% '완성' → 126% '탔어요'. 최대 180%. 95%는 고동색, 120%는 어두운 암갈색, 150%는 검정에 가까운 갈색으로, 초기 색에서 명도만 조정해 표현.\"],[\"수정\",\"· 초기 색에 채도를 더해 갈색이 더 갈색답게, 100% 색은 현재보다 살짝 더 갈색 느낌으로\\n· 시작 후 버튼이 '정지'로 바뀌고 탭하면 초기화, 180%에 도달하면 '다시'로 바뀌고 탭하면 바로 재시작\"]]},\"35\":{\"t\":\"인라인 검증\",\"r\":[[\"오브젝트\",\"가로로 긴 텍스트 상자(플레이스홀더 'a@b.com 처럼 쳐 보세요')와 그 아래 작은 회색 텍스트 '@가 들어가면 통과합니다'.\"],[\"트리거\",\"텍스트 상자에 입력을 시작할 때.\"],[\"반응\",\"상자 모서리와 아래 텍스트가 빨간색이 되며 '@가 필요합니다'로 변경. @가 입력되면 '@ 뒤에 주소가 필요합니다'. 이후 아무 텍스트나 입력되면 모서리와 텍스트가 약간 어두운 노랑으로, '조금만 더 — 주소에 점이 필요합니다'. '.'이 입력되면 초록색, '좋아요'. 처음부터 @를 입력하면 빨간색과 '@ 앞에 이름이 필요합니다'.\"]]},\"36\":{\"t\":\"문자수 카운터\",\"r\":[[\"오브젝트\",\"가로로 넓고 2줄 정도 들어가는 텍스트 상자(플레이스홀더 '40자까지 편하게, 60자가 한계'). 우측 하단에 작은 회색 '0 / 40'.\"],[\"트리거\",\"상자에 타이핑할 때.\"],[\"반응\",\"글자 수에 따라 '0' 숫자가 증가. 33~40자는 '0 / 40'이 어두운 노랑, 41~60자는 빨강.\"],[\"조건\",\"글자 수가 60이면 더 이상 입력 불가.\"]]},\"37\":{\"t\":\"스텝퍼\",\"r\":[[\"오브젝트\",\"중앙에 굵고 큰 숫자 '0', 왼쪽에 원형 회색 − 버튼, 오른쪽에 + 버튼.\"],[\"트리거\",\"각 버튼을 탭하거나 홀드할 때.\"],[\"반응\",\"− 버튼은 숫자를 감소, + 버튼은 증가시킴. 홀드하면 1초 딜레이 후 연속 증감하고, 홀드 시간이 길수록 속도가 빨라지며 한계 속도가 존재.\"],[\"조건\",\"숫자는 0 미만이나 99 초과가 될 수 없음.\"],[\"수정\",\"· 초기 속도 1초당 4, 한계 속도 1초당 14로 조정하고 속도 증가율을 높임 (여러 차례 단계적으로 조정)\"]]},\"38\":{\"t\":\"세그먼트 컨트롤\",\"r\":[[\"오브젝트\",\"양 끝이 반원인 회색 막대형 탭 바에 '강', '중', '약' 텍스트. 처음에는 '강' 부분에 흰색 짧은 막대형 인디케이터가 있고 '강'은 검정, 나머지는 회색.\"],[\"트리거\",\"각 텍스트를 탭할 때.\"],[\"반응\",\"탭한 텍스트는 검정, 나머지는 회색으로 바뀌고 인디케이터가 해당 텍스트로 이동.\"]]},\"39\":{\"t\":\"세그먼트 다이얼\",\"r\":[[\"오브젝트\",\"큰 링 안에 회색 'Level' 텍스트, 링 오른쪽에 굵고 큰 숫자 '0'과 그 아래 작은 회색 '스팀 단계 (0~3)'. 링은 12시에서 3시까지 1/4만 검정으로 채워져 있고, 12시 끝은 직선, 3시 끝은 반원.\"],[\"트리거\",\"링을 탭할 때.\"],[\"반응\",\"3~6시 지점을 탭하면 그 위치까지 채워지며 숫자 1, 6~9시는 2, 9~12시는 3으로 변경. 반원 끝이 링을 따라 이동하며 채워지고, ease in-out 0.5초.\"]]},\"40\":{\"t\":\"토스트\",\"r\":[[\"오브젝트\",\"정사각형보다 살짝 가로가 넓은 사각형 카드. 상단에 회색 '저장 버튼을 눌러보세요', 중하단에 검정 '저장' 버튼.\"],[\"트리거\",\"버튼을 탭할 때.\"],[\"반응\",\"카드 하단에서 카드 폭보다 살짝 좁은, 한 줄짜리 검정 박스가 위로 올라옴. 안에는 흰색 '저장했습니다'. opacity를 조절하며 나타났다가 2초 뒤 반대로 사라짐. spring 적용.\"],[\"수정\",\"· spring 효과를 살짝 감소\\n· 토스트 팝업 속도를 더 빠르게\"]]},\"41\":{\"t\":\"언두 스낵바\",\"r\":[[\"오브젝트\",\"#40과 같은 사각형 카드. 상단에 '읽지 않은 메일 1통'이 들어간 가로로 긴 메일 카드, 중하단 중앙에 작은 '삭제' 버튼.\"],[\"트리거\",\"버튼을 탭할 때.\"],[\"반응\",\"메일 카드가 사라지고, 직후 카드 하단에 #40과 같은 토스트가 올라옴. 토스트 왼쪽에 흰색 '삭제됨', 오른쪽에 형광 청록색 '되돌리기'. '되돌리기'를 탭하면 메일 카드가 원상 복귀. 토스트가 사라지는 방식은 #40과 동일.\"],[\"수정\",\"· 토스트 팝업 속도를 #40처럼 증가\\n· 메일 카드가 삭제된 상태에서도 버튼을 누르면 동일하게 토스트가 뜨도록 수정\\n· 메일 카드는 오른쪽에서 왼쪽으로 스와이프되며 사라지고, 나타날 때는 반대 방향\"]]},\"42\":{\"t\":\"셰이크 거부\",\"r\":[[\"오브젝트\",\"한 줄 텍스트 상자(플레이스홀더 '비밀번호는 1234 입니다'), 오른쪽 끝에 눈 모양 아이콘, 상자 아래 양 옆이 반원인 검정 '확인' 버튼.\"],[\"트리거\",\"텍스트 입력 / 입력 후 버튼 탭.\"],[\"반응\",\"입력한 텍스트는 '•'로 표시. 눈 아이콘을 탭하면 원래 텍스트가 보이며 토글 방식. 버튼을 탭하면 입력값에 따라 반응.\"],[\"조건\",\"1234이면 상자 모서리가 초록색으로 바뀌며 스케일이 커졌다 돌아옴. 1234가 아니면 상자 모서리가 빨간색으로 바뀌고 좌우로 2회 흔들림.\"],[\"수정\",\"· 1234일 때 스케일 변화를 10% → 5%로 조정\"]]},\"43\":{\"t\":\"확인 홀드\",\"r\":[[\"오브젝트\",\"중앙에 빨간색 '꾹 눌러 초기화' 버튼.\"],[\"트리거\",\"버튼을 홀드할 때.\"],[\"반응\",\"버튼 왼쪽에서부터 적갈색이 서서히 채워지고, 오른쪽 끝까지 채워지면 버튼 아래에 작은 회색 '초기화했습니다'가 나타남. 0.5초 뒤 버튼 색이 원복되고 텍스트는 2초간 유지.\"],[\"수정\",\"· 이후 버튼은 별도 언급이 없으면 양 옆이 반원인 pill 형태로, 폭은 텍스트에 맞춰 생성\"]]},\"44\":{\"t\":\"진행을 보여주는 버튼\",\"r\":[[\"오브젝트\",\"가로로 긴 큰 사각형 카드. 상단 좌측에 회색 '받는 사람', 그 오른쪽에 작은 원형 프로필과 '디자인 팀'을 반원 박스로 묶어 배치. 아래는 파티션으로 나누고 본문 '시안 3종 첨부했습니다. 금요일 리뷰 전에 한 번씩 확인 부탁드려요.'. 하단 좌측에 스켈레톤 느낌의 사각형 2개, 하단 우측에 파란 '보내기' 버튼.\"],[\"트리거\",\"버튼을 탭할 때.\"],[\"반응\",\"버튼 채도가 살짝 낮아지고 '보내기' 왼쪽에 회전하는 원형 로딩 바가 나타나며 '보내는 중'으로 변경. 1.2초 후 버튼이 채도 낮은 초록색, 텍스트는 진한 초록의 '보냄'으로 바뀌고 로딩 바는 체크가 그려지는 애니메이션의 초록 체크로 변경. 2초 유지 후 처음 상태로 복귀.\"],[\"수정\",\"· '보내는 중' 색상은 낮은 채도의 파랑이 아니라 기본 파랑에 틴트를 넣는 방식으로\\n· '디자인 팀' 프로필에 사선 곡선의 파란 그라데이션 적용\"]]},\"45\":{\"t\":\"카운트 업\",\"r\":[[\"오브젝트\",\"화면 중앙에 크고 굵은 숫자 3개, 각 숫자 아래 작은 회색 '참여자', '만족도 %', '국가'.\"],[\"트리거\",\"스크롤을 내려 화면에 보일 때.\"],[\"반응\",\"각 숫자가 빠르게 커지며 왼쪽부터 '1,284', '96', '37'에 도달. 빠르게 시작해 서서히 느려지며 2초간 진행.\"],[\"조건\",\"숫자의 최종 글자 수를 고려해 공간 배치.\"],[\"수정\",\"· #11의 '다시보기' 버튼과 동일한 버튼을 같은 역할로 추가\\n· 진행 시간 2.5초 → 2초\\n· #45~47의 여백은 필수 공간만 남기고 압축한 뒤, 살짝 여유를 더함\"]]},\"46\":{\"t\":\"타이핑 효과\",\"r\":[[\"오브젝트\",\"처음에는 화면에 아무것도 없음.\"],[\"트리거\",\"스크롤하여 페이지에 보일 때.\"],[\"반응\",\"'명세서를 쓰고, 만들고, 다듬는다' 텍스트가 범위 중앙에서 시작해 양옆으로 늘어나며 한 글자씩 타이핑됨. 출력되는 동안 텍스트 맨 오른쪽에 글자 높이의 세로 검정 박스(커서)가 있다가 출력이 끝나면 사라짐.\"],[\"수정\",\"· #45와 같은 '다시보기' 버튼 추가\\n· 타이핑 속도를 조금 더 빠르게\"]]},\"47\":{\"t\":\"텍스트 스크램블\",\"r\":[[\"오브젝트\",\"중앙의 'SMART INTERACTION' 텍스트.\"],[\"트리거\",\"스크롤하여 페이지에 보일 때.\"],[\"반응\",\"각 알파벳이 빠르게 랜덤한 알파벳이나 특수기호로 바뀌다가 왼쪽부터 한 글자씩 원래 글자로 확정됨. 총 2초간 진행.\"],[\"조건\",\"'S'는 처음부터 S로 고정되어 변하지 않음.\"],[\"수정\",\"· '다시보기' 버튼 추가\"]]},\"48\":{\"t\":\"바뀐 자리만 굴러가는 숫자\",\"r\":[[\"오브젝트\",\"상단 중앙에 '월간'/'연간'을 고르는 양 끝 반원 탭. '연간' 오른쪽에는 틴트된 초록 프레임에 작은 초록 글씨 '-20%'. 그 아래 세로로 살짝 긴 카드 3장을 가로로 배치. 각 카드는 상단 왼쪽에 플랜명, 아래에 '₩_,___/월'(₩는 살짝 크게, 숫자는 굵고 크게, /월은 회색 보통), 파란 원 불릿 3줄 설명, 그 아래 카드 폭보다 살짝 좁은 버튼. 카드 내용: 베이직 9,900 / 프로젝트 3개·저장공간 5GB·기본 템플릿 / 시작하기, 프로 24,900 / 프로젝트 무제한·저장공간 100GB·버전 기록 / 시작하기, 팀 49,000 / 멤버 10명·저장공간 1TB·권한 관리 / 문의하기. 1·3번 카드는 흰 배경에 회색 버튼, 가운데 카드는 뉴트럴 블랙(아주 약간 푸른 기)에 파란 버튼.\"],[\"트리거\",\"상단에서 '연간'을 탭할 때.\"],[\"반응\",\"금액이 7,900 / 19,900 / 39,000으로 감소. 숫자가 바뀌는 자릿수만 변하며, 금액이 올라갈 때는 숫자가 위로 굴러가며 바뀌고 내려갈 때는 반대 방향.\"],[\"수정\",\"· 숫자가 굴러갈 때 1씩 변하며 돌아가도록 수정\\n· 상단 월간/연간이 차지하는 공간의 균형 조정\\n· 버튼을 사각형에 모서리만 살짝 둥근 형태로 변경\"]]},\"49\":{\"t\":\"틸트 카드\",\"r\":[[\"오브젝트\",\"회색과, 회색에 아주 살짝 노란 기가 섞인 색의 그라데이션 배경을 가진 가로로 살짝 긴 사각형 카드. 중앙에 '기울어지는 카드' 텍스트.\"],[\"트리거\",\"카드에 마우스 커서를 올릴 때.\"],[\"반응\",\"커서가 올라간 부분이 뒤쪽으로 기울어짐.\"],[\"수정\",\"· 마우스가 카드 밖으로 나가면 초기 상태로 복귀\\n· 배경 전체에 톤을 더해 더 어둡게\"]]},\"50\":{\"t\":\"스크롤 스크럽\",\"r\":[[\"오브젝트\",\"범위 대부분을 채우는 흰색 사각형 카드. 카드 안 중앙과 왼쪽 사이에 모서리가 둥근 검정 정사각형 하나.\"],[\"트리거\",\"카드 안에서 스크롤할 때.\"],[\"반응\",\"정사각형이 왼쪽으로 굴러가며 중앙을 지나는 지점부터 원으로 변하기 시작해 반대편에 도달하면 완전한 원이 됨. 색도 중앙부터 서서히 빨강으로 변해 마지막에 완전한 빨강. 카드 오른쪽에는 스크롤 인디케이터가 함께 움직임.\"],[\"수정\",\"· 초기 사각형의 라운드 값을 더 주고, 바닥에서 굴러가는 느낌을 강화\"]]},\"51\":{\"t\":\"스크롤 스파이\",\"r\":[[\"오브젝트\",\"화면 중앙의 사각형 카드. 카드 안은 스크롤 가능하며 카드 3개 분량을 내려갈 수 있음. 3개 섹션이 있고 각 섹션 상단에 '소개 - 스크롤해보세요', '기능 - 왼쪽 목차를 보세요', '가격 - 표시가 따라옵니다'. 카드 왼쪽에는 회색 '소개', '기능', '가격'이 세로로 나열되고 '소개'에 검정 둥근 사각형 인디케이터.\"],[\"트리거\",\"카드를 스크롤해 새 섹션이 카드 중간보다 위로 올라올 때.\"],[\"반응\",\"왼쪽 인디케이터가 해당 섹션의 키워드로 이동. 반대 방향 스크롤에서도 동일하게 동작.\"]]}}; }\n_pg(n, i, d) {\nconst a = this.$h._pp && this.$h._pp[n];\nreturn a && a[i] !== undefined && !isNaN(a[i]) ? a[i] : d;\n}\n_pc(n, i, d) {\nconst a = this.$h._pp && this.$h._pp[n];\nreturn a && typeof a[i] === 'string' ? a[i] : d;\n}\n_hx(c) {\nconst m = /^#?([0-9a-f]{6})$/i.exec(c || '');\nconst v = m ? parseInt(m[1], \"올린 카드가 줌인되며 내부에 '#1', '#2' 글자가 나타남. 글자는 카드 왼쪽 하단에서 위로 올라오며 opacity가 함께 증가하고, 마우스를 내리면 줌아웃되며 내려가면서 사라짐. 줌 이징은 ease out, 글자는 흰색 약 7pt.\"],[\"수정\",\"· 카드 세로 길이를 가로 길이보다 살짝 짧게 조정\"]]},\"5\":{\"t\":\"애니메이티드 언더라인\",\"r\":[[\"오브젝트\",\"'포트폴리오', '소개', '연락' 텍스트가 한 줄로 나열.\"],[\"트리거\",\"각 텍스트에 마우스를 올렸을 때.\"],[\"반응\",\"텍스트 아래에 왼쪽에서 오른쪽으로 언더라인이 그려지고, 마우스를 내리면 다시 왼쪽으로 사라짐. ease out 적용, 두께 2pt.\"],[\"수정\",\"· 언더라인 두께를 1pt로 조정\\n· 선이 오른쪽 끝까지 찼을 때 두께가 다시 2pt로 돌아가는 문제 수정\"]]},\"6\":{\"t\":\"커스텀 커서\",\"r\":[[\"오브젝트\",\"#6 인터랙션 범위에 해당하는 캔버스 영역.\"],[\"트리거\",\"마우스가 범위 안에서 움직일 때.\"],[\"반응\",\"기본 커서를 흰 원(희미한 회색 아웃라인)으로 교체해 마우스를 실시간으로 따라가게 함. 범위에 들어올 때 opacity를 ease out으로 나타내고, 나갈 때도 같은 방식으로 사라지게 함.\"],[\"수정\",\"· 커서 크기를 지름 30pt 원으로 변경\"]]},\"7\":{\"t\":\"머물면 뜨는 정보카드\",\"r\":[[\"오브젝트\",\"넓은 사각형 카드 안에 '공지 · 오늘 오전 10:12'(작은 회색)와 이어지는 본문 '이번 주 회의는 김서연님이 진행하고, 발표 자료는 박도윤님이 정리해서 공유할 예정입니다. 질문은 금요일까지 남겨 주세요.'(일반 크기). '김서연'과 '박도윤'은 볼드·언더라인·파란 글씨.\"],[\"트리거\",\"'김서연' 또는 '박도윤'에 마우스를 올렸을 때.\"],[\"반응\",\"0.3초 딜레이 후 해당 이름 위에 말풍선 카드가 나타남. 아래에서 위로 스케일 0→100, 통통 튀는 spring 이징. 카드 안에는 상단에 이름이 들어간 원형 프로필, 오른쪽에 큰 성/이름과 그 아래 회색 '프로덕트 디자이너', 하단에 '모바일 결제 흐름과 온보딩 화면을 맡고 있어요' 설명. 마우스를 떼면 ease in으로 원상복귀.\"]]},\"8\":{\"t\":\"스태거 리빌\",\"r\":[[\"오브젝트\",\"모서리가 둥근 사각형 카드 3장.\"],[\"트리거\",\"스크롤을 내려 카드가 화면 중앙에 가까워질 때.\"],[\"반응\",\"카드가 아래에서 위로 올라오며 opacity 0→100. ease out, 왼쪽부터 0.2초 간격으로 순차 등장. 오른쪽 상단(타이틀 반대편)에 스크롤을 이미 내린 상태에서도 다시 확인할 수 있는 작은 '다시보기' 버튼 배치.\"],[\"수정\",\"· 카드 세로 길이를 가로보다 짧게 조정 (이후 카드는 항상 이 비율로 생성)\\n· 아래쪽 여백 소폭 축소\"]]},\"9\":{\"t\":\"패럴랙스\",\"r\":[[\"오브젝트\",\"범위를 가득 채우는 뒷면 레이어(대각선 흰색·회색 줄무늬)와, 검정 버튼 형태로 '앞면 레이어'라고 적힌 앞면 레이어.\"],[\"트리거\",\"스크롤할 때.\"],[\"반응\",\"앞면 레이어는 스크롤 속도대로 움직이고, 뒷면 레이어는 더 느리게 움직여 두 층이 분리되어 보이게 함.\"],[\"수정\",\"· 효과가 잘 보이도록 줄무늬를 더 두껍게, 스크롤 움직임에 ease out 적용\\n· 느려진 속도에 맞춰 뒷면의 이동 거리도 더 줄임\"]]},\"10\":{\"t\":\"스크롤 프로그레스\",\"r\":[[\"오브젝트\",\"가로:세로 10:8 비율의 텍스트 박스. 안에는 스크롤 프로그레스의 원리와 용도를 설명하는 여러 문단이 들어 있음('이 상자 안에서 스크롤해 보세요…' ~ '끝까지 내리면 줄이 꽉 찹니다').\"],[\"트리거\",\"박스 위에 마우스를 올리고 스크롤할 때.\"],[\"반응\",\"스크롤을 내리면 박스 위쪽 모서리에 왼쪽부터 진행선이 차오르고, 오른쪽에는 스크롤 인디케이터 표시. ease out 적용.\"],[\"수정\",\"· 텍스트 상자 세로 비율 축소, 가로 길이 10% 축소(가운데 기준)\\n· #9와 #10 사이 간격 축소\"]]},\"11\":{\"t\":\"마스크드 텍스트 리빌\",\"r\":[[\"오브젝트\",\"'문장이 줄 단위로, / 아래에서 걷히듯, / 차례로 나타난다.' 3줄 텍스트.\"],[\"트리거\",\"스크롤할 때.\"],[\"반응\",\"스크롤 범위에 따라 한 줄씩 아래에서 위로 나타남.\"],[\"수정\",\"· '다시보기' 버튼 추가\\n· 타이틀과 내용 사이 간격을 절반으로 축소\"]]},\"12\":{\"t\":\"스크롤 피닝\",\"r\":[[\"오브젝트\",\"인터랙션 범위를 거의 채우는 사각형 카드.\"],[\"트리거\",\"페이지를 스크롤할 때.\"],[\"반응\",\"처음에는 아이보리 배경에 '1단계 - 계속 스크롤', 1/3 지점을 지나면 민트색 배경에 '2단계 - 색이 바뀌고', 3단계에서는 검정 배경·흰 글씨로 '3단계 - 완료!'로 변경.\"],[\"조건\",\"카드와 타이틀을 포함한 인터랙션 범위가 화면 중앙에 닿으면 3단계에 이를 때까지 중앙에 머무름(페이지는 계속 스크롤). 일반 인터랙션 범위의 약 6배 영역 할당.\"],[\"수정\",\"· 고정 방식을 스크롤 속도에 맞춰 범위가 함께 아래로 이동하는 방식으로 바꿔 떨림 방지\\n· 오타 수정('색이 바뀌고')\\n· 아트보드 하단까지 가능한 한 넓은 범위 부여\"]]},\"13\":{\"t\":\"오토하이드 헤더\",\"r\":[[\"오브젝트\",\"#10과 같은 텍스트 상자(스크롤 프로그레스 바 없음). 상자 상단에 '헤더'라고 적힌 헤더 박스. 본문은 오토하이드 헤더의 원리를 설명하는 문단들('이 상자 안에서 아래로 내려 보세요 — 위 헤더가 숨습니다.' ~ '지금 위로 올려 보세요.').\"],[\"트리거\",\"텍스트 상자 안에서 스크롤할 때.\"],[\"반응\",\"아래로 스크롤하면 헤더가 위로 올라가 숨고, 위로 스크롤하면 다시 내려와 나타남. ease out 적용.\"]]},\"14\":{\"t\":\"드래그 캐러셀\",\"r\":[[\"오브젝트\",\"범위 안에 사각형 카드 5장(가운데에 1~5 숫자, 파스텔 톤 랜덤 색상). 1번부터 왼쪽에 정렬하고, 3번은 오른쪽 경계에 걸쳐 보이며 4·5번은 범위 밖에 있어 보이지 않음.\"],[\"트리거\",\"카드가 놓인 영역을 잡고 드래그할 때.\"],[\"반응\",\"카드들이 함께 좌우로 이동해 5번 카드까지 확인할 수 있음. 1번이 맨 왼쪽, 5번이 맨 오른쪽에 올 때까지만 이동 가능.\"],[\"조건\",\"한계에 닿으면 경계 저항 구현.\"]]},\"15\":{\"t\":\"비포/애프터\",\"r\":[[\"오브젝트\",\"좌우를 꽉 채우는 사각형 카드. 중앙에 세로선 핸들이 있고, 핸들 왼쪽은 포레스트 그린, 오른쪽은 버건디.\"],[\"트리거\",\"핸들을 잡고 좌우로 드래그할 때.\"],[\"반응\",\"핸들 위치에 따라 영역이 조정되어, 핸들 왼쪽은 그린, 오른쪽은 버건디로 채워짐.\"],[\"조건\",\"핸들은 카드 좌우 최대 97% 위치까지만 이동 가능.\"],[\"수정\",\"· 핸들 표시를 지우고 선 자체가 핸들로 동작하게 변경\\n· 두 색을 파스텔 톤으로 교체\\n· 카드 양 끝이 범위에서 살짝 떨어지도록 하고 모서리를 둥글게 처리\"]]},\"16\":{\"t\":\"로터리 다이얼\",\"r\":[[\"오브젝트\",\"중심에 검정 원형 다이얼과 그 위의 짧은 흰색 인디케이터. 다이얼 주변에는 6등분된 회색 위치 인디케이터. 다이얼 오른쪽에는 '작품 1' 텍스트.\"],[\"트리거\",\"다이얼을 드래그할 때.\"],[\"반응\",\"다이얼이 회전하며 인디케이터가 위치 인디케이터에 맞춰짐. 드래그를 놓으면 가장 가까운 위치로 ease out 스냅. 맨 위에서 시계 방향으로 1~6이 되며 '작품' 뒤 숫자가 바뀌고, 드래그 중에도 가장 가까운 위치 기준으로 숫자가 변경됨.\"],[\"수정\",\"· 가장 가까운(선택된) 위치 인디케이터는 살짝 더 두꺼운 검정 선으로 표시\"]]},\"17\":{\"t\":\"드래그 앤 드롭 정렬\",\"r\":[[\"오브젝트\",\"좌우로 길고 위아래로 짧은 회색 카드 3개('첫번째 항목', '두번째 항목', '세번째 항목')가 세로로 정렬.\"],[\"트리거\",\"카드를 집어 드래그할 때.\"],[\"반응\",\"집은 카드가 살짝 줌인되고 drop shadow로 떠 있는 느낌을 줌. 위아래로 움직이면 다른 카드들이 따라 재정렬되어 순서를 바꿀 수 있음. 레이아웃은 초기와 동일하게 유지하고 순서만 변경, 드래그 중인 카드는 맨 앞에 표시.\"]]},\"18\":{\"t\":\"슬라이더 매핑\",\"r\":[[\"오브젝트\",\"왼쪽에 밝은 노란색으로 채워진 원, 오른쪽에 흰색/검정 슬라이더.\"],[\"트리거\",\"슬라이더 핸들을 잡고 좌우로 움직일 때.\"],[\"반응\",\"슬라이더에 따라 원의 조도가 변하고, 슬라이더 왼쪽은 검정이 차오르며 오른쪽은 흰색으로 보임.\"],[\"수정\",\"· 조도가 바뀌는 방향을 반대로 변경\\n· 원 주변 glow 이펙트 제거, 노란색을 더 낮은 채도로 변경\"]]},\"19\":{\"t\":\"컨디셔널 스테이트\",\"r\":[[\"오브젝트\",\"위와 같은 슬라이더를 배치하고 왼쪽에 '준비' 텍스트.\"],[\"트리거\",\"슬라이더를 잡고 드래그할 때.\"],[\"반응\",\"1/3 지점을 넘으면 '익는 중', 2/3 지점을 넘으면 '완성'으로 변경. 새 글자는 아래에서 위로 올라오며 opacity 0→100, 모두 ease out.\"],[\"수정\",\"· 왼쪽으로 돌아갈 때도 글자가 나타나는 방식은 동일하게 유지\\n· 기존 글자는 duration 없이 즉시 사라지도록 변경\"]]},\"20\":{\"t\":\"테마 토글\",\"r\":[[\"오브젝트\",\"'지금 테마 · 라이트' 텍스트와 오른쪽 스위치, 두 요소를 감싸는 밝은 회색 카드.\"],[\"트리거\",\"스위치를 토글할 때.\"],[\"반응\",\"카드가 검정으로, 텍스트가 흰색으로 바뀌고 '라이트'가 '다크'로 변경. 카드 폭은 텍스트 길이에 따라 자동 조정되며 ease out, 텍스트는 opacity가 서서히 변함.\"],[\"수정\",\"· 라이트 테마 느낌이 나도록 밝은 회색에 약간의 노란 톤 추가\"]]},\"21\":{\"t\":\"프로그레스 게이지\",\"r\":[[\"오브젝트\",\"좌우로 프로그레스 바와 슬라이더를 배치하고, 가운데에 바가 채워진 비율만큼의 숫자 표시.\"],[\"트리거\",\"슬라이더를 잡고 드래그할 때.\"],[\"반응\",\"프로그레스 바가 슬라이더에 맞춰 채워지거나 비워지고, 숫자는 0~100으로 변경. 변화에 ease out 적용.\"]]},\"22\":{\"t\":\"프리셋 리콜\",\"r\":[[\"오브젝트\",\"슬라이더 2개를 위아래로 배치하고 각각 왼쪽에 작은 '온도', '시간' 텍스트, 오른쪽에 채움 비율(%). 슬라이더 아래에 '세팅 1', '세팅 2' 버튼, 그 아래 작은 안내 문구 '기본 프리셋이 들어 있어요 — 탭해 보세요'. 우측 상단에는 타이틀과 같은 스타일로 '길게 누르면 저장 · 탭하면 불러오기'.\"],[\"트리거\",\"슬라이더 드래그 / 버튼 탭 / 버튼 길게 누르기.\"],[\"반응\",\"드래그하면 오른쪽 숫자가 백분율로 변함. 버튼을 탭하면 저장된 값으로 슬라이더가 이동(세팅 1: 온도 80·시간 20, 세팅 2: 온도 60·시간 35)하며 문구가 '세팅 N 불러오는 중 — 슬라이더가 움직여요'로 변경. 버튼을 길게 누르면 현재 슬라이더 위치가 해당 세팅 값으로 새로 저장되고 문구가 '세팅 N에 저장했어요'로 변경.\"],[\"수정\",\"· 세팅 1·2 버튼 색상을 옅은 노란색, 텍스트는 검정으로 변경\"]]},\"23\":{\"t\":\"푸시 트랜지션\",\"r\":[[\"오브젝트\",\"세로로 긴 카드. 상단에 '내 작품' 헤더, 그 아래 '작품 1', '작품 2', '작품 3' 항목이 얇은 선으로 구분되어 세로 정렬. 헤더를 제외한 항목 옆에는 작은 화살표.\"],[\"트리거\",\"화살표 또는 화살표가 붙은 항목을 탭할 때.\"],[\"반응\",\"카드가 옆으로 넘어가며 헤더가 탭한 항목 이름으로 바뀜. 헤더 왼쪽에 뒤로가기 화살표가 생겨 누르면 이전 화면으로 복귀. 상세 화면은 중앙에 다른 색의 작은 사각형 카드, 그 아래 'push 전환으로 들어온 상세화면' 텍스트.\"]]},\"24\":{\"t\":\"바텀 시트\",\"r\":[[\"오브젝트\",\"사각형 카드, 중앙에 '시트 열기' 텍스트의 검정 버튼. 카드 하단에는 shadow 그라데이션.\"],[\"트리거\",\"'시트 열기' 버튼을 탭할 때.\"],[\"반응\",\"아래에서 바텀 시트가 올라와 화면의 60%를 덮음. 패널에는 굵은 '아래서 올라온 커버'와 얇은 '핸들을 탭하면 닫혀요'. shadow 그라데이션도 시트와 함께 올라오고, 시트 상단 중앙의 선 모양 핸들을 탭하면 시트가 아래로 내려가 닫힘.\"],[\"수정\",\"· 카드 윤곽선이 살짝 보이도록 수정\"]]},\"25\":{\"t\":\"슬라이딩 탭 인디케이터\",\"r\":[[\"오브젝트\",\"가로로 긴 '홈 / 보관함 / 설정' 탭. 처음에는 '홈' 위에 검정 선 인디케이터.\"],[\"트리거\",\"탭 안의 각 텍스트를 탭할 때.\"],[\"반응\",\"탭한 텍스트 위쪽으로 선 인디케이터가 이동. 각 탭 영역은 텍스트 길이에 따라 배정하고, 인디케이터 길이도 영역에 맞춰 조정. ease in-out 적용.\"],[\"수정\",\"· 탭 전체를 사각형 카드로 감싸 중앙에 배치\\n· 카드 색과 인디케이터가 선택되지 않은 부분의 색을 통일하고, 카드 모서리 둥글기 감소\"]]},\"26\":{\"t\":\"카드 플립 시퀀스\",\"r\":[[\"오브젝트\",\"'스', '마', '트', '인', '터' 글자별 작은 아이보리 사각형 카드를 수평 정렬하고, 맨 오른쪽에 모서리를 더 둥글게 한 버튼 모양의 '재생' 카드(아이보리).\"],[\"트리거\",\"'재생' 버튼을 탭할 때.\"],[\"반응\",\"왼쪽부터 각 카드가 위아래로 2바퀴 뒤집히며 검정으로 변함. 카드별 0.2초 딜레이(재생 카드 제외). 모든 카드가 바뀌고 2초 뒤 전부 동시에 원래 색으로 복귀.\"],[\"수정\",\"· 원상태로 돌아가는 duration을 0.5초로 증가\"]]},\"27\":{\"t\":\"와이프 트랜지션\",\"r\":[[\"오브젝트\",\"범위의 절반 정도 크기의 아이보리 사각형 카드('화면 1' 텍스트)와, 카드 옆의 아이보리 '전환' 버튼.\"],[\"트리거\",\"'전환' 버튼을 탭할 때.\"],[\"반응\",\"카드 왼쪽에서 오른쪽으로 검정이 와이프되어 채워지고, 다 채워지면 검정이 0.2초 동안 opacity 0으로 사라지며 '화면 2'가 나타남. 다시 누르면 같은 방식으로 '화면 1'로 복귀.\"]]},\"28\":{\"t\":\"버튼이 펼쳐지는 메뉴\",\"r\":[[\"오브젝트\",\"범위 대부분을 덮는 사각형 카드. 좌측 상단에 큰 '스케치 내용 정리' 텍스트와 다양한 요소들이 있고, 우측 상단에는 텍스트 크기 정도의 원형 버튼(가운데 가로 점 3개).\"],[\"트리거\",\"원형 버튼을 탭할 때.\"],[\"반응\",\"버튼에서 시작해 버튼을 가리며 왼쪽 아래로 사각형 메뉴 카드가 펼쳐짐. 메뉴는 '이름 바꾸기', '공유', '복제', '보관', '삭제'가 세로로 나열되고 각 텍스트 앞에 아이콘이 있으며, 삭제 메뉴와 아이콘은 빨간색. 메뉴와 버튼은 마우스를 올리면 색이 진해짐. 메뉴를 클릭하거나 카드 바깥을 탭하면 다시 접힘.\"],[\"수정\",\"· 버튼 클릭이 동작하지 않는 문제 수정\\n· '컬러' 오타 수정, 추가 요소들의 색상은 회색으로 통일\"]]},\"29\":{\"t\":\"펼침·접힘 목록\",\"r\":[[\"오브젝트\",\"넓은 사각형 카드. 카드 바깥 왼쪽 위에 큰 '자주 묻는 질문'. 카드 안에는 '수업 자료는 어디서 받나요?', '과제 제출 기한을 넘기면 어떻게 되나요?', '팀은 어떻게 정하나요?', '노트북이 꼭 필요한가요?', '결석하면 보강이 있나요?' 5개 메뉴가 세로로 나열되고 각 항목 오른쪽 끝에 V자 화살표.\"],[\"트리거\",\"각 메뉴를 탭할 때.\"],[\"반응\",\"메뉴 텍스트와 화살표가 파란색으로 바뀌고 화살표는 위아래로 뒤집힘. 메뉴가 아래로 늘어나며 질문에 대한 답변(임의 작성)이 약간 작은 회색 글씨로 표시됨.\"],[\"조건\",\"한 번에 하나의 메뉴만 열림. 열려 있는 메뉴를 다시 탭하면 원래대로 닫힘.\"]]},\"30\":{\"t\":\"풀 투 리프레시\",\"r\":[[\"오브젝트\",\"세로로 긴 좁은 사각형 카드. 안에 '메세지 1' ~ '메세지 4'가 메뉴 형식으로 세로 배치.\"],[\"트리거\",\"카드를 드래그해 아래로 당길 때.\"],[\"반응\",\"당기는 만큼 카드 상단에 회색 배경이 내려오고 회전 화살표가 opacity와 함께 나타남. 더 당길수록 화살표가 시계 방향으로 회전. 메뉴 한 칸 높이 이상 당긴 뒤 놓으면 상단 배경이 한 칸 높이로 맞춰져 1초간 유지되고 화살표가 빠르게 한 바퀴 돈 뒤 영역이 다시 닫힘.\"],[\"수정\",\"· 메뉴는 누르는 동안에만 배경색보다 살짝 밝은 회색으로 변경\\n· 화살표는 직선 화살표가 아닌 ↻ 모양으로 변경\\n· 회전 화살표는 놓은 시점부터 한 바퀴 회전(Rotate to가 아닌 Rotate by)\"]]},\"31\":{\"t\":\"파티클 버스트\",\"r\":[[\"오브젝트\",\"화면 중앙의 작은 입체감 있는 흰색 하트.\"],[\"트리거\",\"하트를 탭할 때.\"],[\"반응\",\"하트가 빨간색으로 바뀌며 스케일이 spring으로 잠시 커졌다 줄어듦. 빨간색으로 바뀔 때 중앙에서 빨간 링이 퍼져나가고, 링과 함께 작은 하트 9개가 바깥으로 뻗어나감. 링과 하트는 opacity 약 60%. 다시 탭하면 흰색 하트로 돌아가며 링과 하트 효과는 생략.\"],[\"수정\",\"· 링 두께 약 10px, 퍼져나가는 효과 구현 수정\\n· 링 최종 지름을 절반 정도로 축소, 하트는 더 키우고 링과 같은 지점에서 시작해 링보다 20px 더 이동\\n· 링은 처음에 얇다가 퍼지며 두꺼워지도록 변경\\n· 하트 자체의 회전 각도를 좌우 ±30° 내에서 랜덤하게, 크기도 ±15% 범위에서 조금씩 다르게\\n· 퍼져나가는 거리도 ±10px 범위에서 조금씩 다르게\"]]},\"32\":{\"t\":\"스켈레톤 UI\",\"r\":[[\"오브젝트\",\"범위 안에 굵은 '로딩이 끝난 진짜 제목'과 가는 '본문 내용이 여기 들어갑니다'를 위아래로 배치하고, 오른쪽에 아이보리 '새로고침' 버튼.\"],[\"트리거\",\"버튼을 탭할 때.\"],[\"반응\",\"텍스트 레이아웃을 보여주는 둥근 박스 2개가 딜레이 없이 3초간 나타남. 3초 후 박스는 빠르게 사라지고 기존 텍스트가 각 줄별로 아래에서 위로 올라오며 나타남. 박스 안에는 로딩 표시로 색이 조금씩 변하는 wave 효과.\"]]},\"33\":{\"t\":\"스와이프 액션\",\"r\":[[\"오브젝트\",\"'밀 수 있는 셀' 텍스트가 들어간, 가로로 길고 위아래는 텍스트를 감쌀 정도인 회색 사각형 카드.\"],[\"트리거\",\"카드를 왼쪽 또는 오른쪽으로 드래그할 때.\"],[\"반응\",\"왼쪽으로 드래그하면 오른쪽 끝에서 빨간 영역이 나오고, 당기는 만큼 '삭제' 텍스트의 opacity가 올라 텍스트 폭을 넘으면 100%. 반대로 당기면 같은 반응으로 왼쪽에서 파란 영역과 '보관' 텍스트.\"],[\"조건\",\"당긴 정도가 절반 이하면 텍스트가 보일 만큼만 고정, 절반 이상이면 카드가 완전히 넘어가며 색으로 가득 참(텍스트를 탭해도 동일). 이후 3초 뒤 원상 복귀.\"],[\"수정\",\"· 살짝 밀린 상태에서 다시 원래 위치로 밀면 초기 상태로 복귀\\n· 가득 찬 뒤 복귀는 opacity가 아니라 카드 아래 모서리가 위로 올라오며 사라지는 방식: 0.5초 사라짐 → 2초 유지 → 0.5초 나타남, ease out\\n· 드래그가 끊기고 버벅이는 느낌 개선\"]]},\"34\":{\"t\":\"시간 경과 상태 변화\",\"r\":[[\"오브젝트\",\"왼쪽에 밝고 낮은 채도의 노란 원, 그 옆에 굵은 '설정하세요'와 그 아래 작고 얇은 회색 '0%'. 범위 오른쪽에 검정 '시작' 버튼.\"],[\"트리거\",\"버튼을 탭할 때.\"],[\"반응\",\"원의 색이 조금씩 갈색으로 변하고 퍼센트가 실시간으로 올라감(초당 12%p). 텍스트는 '굽는 중' → 33% '익어가는 중' → 66% '거의 다 됐어요' → 100% '완성' → 126% '탔어요'. 최대 180%. 95%는 고동색, 120%는 어두운 암갈색, 150%는 검정에 가까운 갈색으로, 초기 색에서 명도만 조정해 표현.\"],[\"수정\",\"· 초기 색에 채도를 더해 갈색이 더 갈색답게, 100% 색은 현재보다 살짝 더 갈색 느낌으로\\n· 시작 후 버튼이 '정지'로 바뀌고 탭하면 초기화, 180%에 도달하면 '다시'로 바뀌고 탭하면 바로 재시작\"]]},\"35\":{\"t\":\"인라인 검증\",\"r\":[[\"오브젝트\",\"가로로 긴 텍스트 상자(플레이스홀더 'a@b.com 처럼 쳐 보세요')와 그 아래 작은 회색 텍스트 '@가 들어가면 통과합니다'.\"],[\"트리거\",\"텍스트 상자에 입력을 시작할 때.\"],[\"반응\",\"상자 모서리와 아래 텍스트가 빨간색이 되며 '@가 필요합니다'로 변경. @가 입력되면 '@ 뒤에 주소가 필요합니다'. 이후 아무 텍스트나 입력되면 모서리와 텍스트가 약간 어두운 노랑으로, '조금만 더 — 주소에 점이 필요합니다'. '.'이 입력되면 초록색, '좋아요'. 처음부터 @를 입력하면 빨간색과 '@ 앞에 이름이 필요합니다'.\"]]},\"36\":{\"t\":\"문자수 카운터\",\"r\":[[\"오브젝트\",\"가로로 넓고 2줄 정도 들어가는 텍스트 상자(플레이스홀더 '40자까지 편하게, 60자가 한계'). 우측 하단에 작은 회색 '0 / 40'.\"],[\"트리거\",\"상자에 타이핑할 때.\"],[\"반응\",\"글자 수에 따라 '0' 숫자가 증가. 33~40자는 '0 / 40'이 어두운 노랑, 41~60자는 빨강.\"],[\"조건\",\"글자 수가 60이면 더 이상 입력 불가.\"]]},\"37\":{\"t\":\"스텝퍼\",\"r\":[[\"오브젝트\",\"중앙에 굵고 큰 숫자 '0', 왼쪽에 원형 회색 − 버튼, 오른쪽에 + 버튼.\"],[\"트리거\",\"각 버튼을 탭하거나 홀드할 때.\"],[\"반응\",\"− 버튼은 숫자를 감소, + 버튼은 증가시킴. 홀드하면 1초 딜레이 후 연속 증감하고, 홀드 시간이 길수록 속도가 빨라지며 한계 속도가 존재.\"],[\"조건\",\"숫자는 0 미만이나 99 초과가 될 수 없음.\"],[\"수정\",\"· 초기 속도 1초당 4, 한계 속도 1초당 14로 조정하고 속도 증가율을 높임 (여러 차례 단계적으로 조정)\"]]},\"38\":{\"t\":\"세그먼트 컨트롤\",\"r\":[[\"오브젝트\",\"양 끝이 반원인 회색 막대형 탭 바에 '강', '중', '약' 텍스트. 처음에는 '강' 부분에 흰색 짧은 막대형 인디케이터가 있고 '강'은 검정, 나머지는 회색.\"],[\"트리거\",\"각 텍스트를 탭할 때.\"],[\"반응\",\"탭한 텍스트는 검정, 나머지는 회색으로 바뀌고 인디케이터가 해당 텍스트로 이동.\"]]},\"39\":{\"t\":\"세그먼트 다이얼\",\"r\":[[\"오브젝트\",\"큰 링 안에 회색 'Level' 텍스트, 링 오른쪽에 굵고 큰 숫자 '0'과 그 아래 작은 회색 '스팀 단계 (0~3)'. 링은 12시에서 3시까지 1/4만 검정으로 채워져 있고, 12시 끝은 직선, 3시 끝은 반원.\"],[\"트리거\",\"링을 탭할 때.\"],[\"반응\",\"3~6시 지점을 탭하면 그 위치까지 채워지며 숫자 1, 6~9시는 2, 9~12시는 3으로 변경. 반원 끝이 링을 따라 이동하며 채워지고, ease in-out 0.5초.\"]]},\"40\":{\"t\":\"토스트\",\"r\":[[\"오브젝트\",\"정사각형보다 살짝 가로가 넓은 사각형 카드. 상단에 회색 '저장 버튼을 눌러보세요', 중하단에 검정 '저장' 버튼.\"],[\"트리거\",\"버튼을 탭할 때.\"],[\"반응\",\"카드 하단에서 카드 폭보다 살짝 좁은, 한 줄짜리 검정 박스가 위로 올라옴. 안에는 흰색 '저장했습니다'. opacity를 조절하며 나타났다가 2초 뒤 반대로 사라짐. spring 적용.\"],[\"수정\",\"· spring 효과를 살짝 감소\\n· 토스트 팝업 속도를 더 빠르게\"]]},\"41\":{\"t\":\"언두 스낵바\",\"r\":[[\"오브젝트\",\"#40과 같은 사각형 카드. 상단에 '읽지 않은 메일 1통'이 들어간 가로로 긴 메일 카드, 중하단 중앙에 작은 '삭제' 버튼.\"],[\"트리거\",\"버튼을 탭할 때.\"],[\"반응\",\"메일 카드가 사라지고, 직후 카드 하단에 #40과 같은 토스트가 올라옴. 토스트 왼쪽에 흰색 '삭제됨', 오른쪽에 형광 청록색 '되돌리기'. '되돌리기'를 탭하면 메일 카드가 원상 복귀. 토스트가 사라지는 방식은 #40과 동일.\"],[\"수정\",\"· 토스트 팝업 속도를 #40처럼 증가\\n· 메일 카드가 삭제된 상태에서도 버튼을 누르면 동일하게 토스트가 뜨도록 수정\\n· 메일 카드는 오른쪽에서 왼쪽으로 스와이프되며 사라지고, 나타날 때는 반대 방향\"]]},\"42\":{\"t\":\"셰이크 거부\",\"r\":[[\"오브젝트\",\"한 줄 텍스트 상자(플레이스홀더 '비밀번호는 1234 입니다'), 오른쪽 끝에 눈 모양 아이콘, 상자 아래 양 옆이 반원인 검정 '확인' 버튼.\"],[\"트리거\",\"텍스트 입력 / 입력 후 버튼 탭.\"],[\"반응\",\"입력한 텍스트는 '•'로 표시. 눈 아이콘을 탭하면 원래 텍스트가 보이며 토글 방식. 버튼을 탭하면 입력값에 따라 반응.\"],[\"조건\",\"1234이면 상자 모서리가 초록색으로 바뀌며 스케일이 커졌다 돌아옴. 1234가 아니면 상자 모서리가 빨간색으로 바뀌고 좌우로 2회 흔들림.\"],[\"수정\",\"· 1234일 때 스케일 변화를 10% → 5%로 조정\"]]},\"43\":{\"t\":\"확인 홀드\",\"r\":[[\"오브젝트\",\"중앙에 빨간색 '꾹 눌러 초기화' 버튼.\"],[\"트리거\",\"버튼을 홀드할 때.\"],[\"반응\",\"버튼 왼쪽에서부터 적갈색이 서서히 채워지고, 오른쪽 끝까지 채워지면 버튼 아래에 작은 회색 '초기화했습니다'가 나타남. 0.5초 뒤 버튼 색이 원복되고 텍스트는 2초간 유지.\"],[\"수정\",\"· 이후 버튼은 별도 언급이 없으면 양 옆이 반원인 pill 형태로, 폭은 텍스트에 맞춰 생성\"]]},\"44\":{\"t\":\"진행을 보여주는 버튼\",\"r\":[[\"오브젝트\",\"가로로 긴 큰 사각형 카드. 상단 좌측에 회색 '받는 사람', 그 오른쪽에 작은 원형 프로필과 '디자인 팀'을 반원 박스로 묶어 배치. 아래는 파티션으로 나누고 본문 '시안 3종 첨부했습니다. 금요일 리뷰 전에 한 번씩 확인 부탁드려요.'. 하단 좌측에 스켈레톤 느낌의 사각형 2개, 하단 우측에 파란 '보내기' 버튼.\"],[\"트리거\",\"버튼을 탭할 때.\"],[\"반응\",\"버튼 채도가 살짝 낮아지고 '보내기' 왼쪽에 회전하는 원형 로딩 바가 나타나며 '보내는 중'으로 변경. 1.2초 후 버튼이 채도 낮은 초록색, 텍스트는 진한 초록의 '보냄'으로 바뀌고 로딩 바는 체크가 그려지는 애니메이션의 초록 체크로 변경. 2초 유지 후 처음 상태로 복귀.\"],[\"수정\",\"· '보내는 중' 색상은 낮은 채도의 파랑이 아니라 기본 파랑에 틴트를 넣는 방식으로\\n· '디자인 팀' 프로필에 사선 곡선의 파란 그라데이션 적용\"]]},\"45\":{\"t\":\"카운트 업\",\"r\":[[\"오브젝트\",\"화면 중앙에 크고 굵은 숫자 3개, 각 숫자 아래 작은 회색 '참여자', '만족도 %', '국가'.\"],[\"트리거\",\"스크롤을 내려 화면에 보일 때.\"],[\"반응\",\"각 숫자가 빠르게 커지며 왼쪽부터 '1,284', '96', '37'에 도달. 빠르게 시작해 서서히 느려지며 2초간 진행.\"],[\"조건\",\"숫자의 최종 글자 수를 고려해 공간 배치.\"],[\"수정\",\"· #11의 '다시보기' 버튼과 동일한 버튼을 같은 역할로 추가\\n· 진행 시간 2.5초 → 2초\\n· #45~47의 여백은 필수 공간만 남기고 압축한 뒤, 살짝 여유를 더함\"]]},\"46\":{\"t\":\"타이핑 효과\",\"r\":[[\"오브젝트\",\"처음에는 화면에 아무것도 없음.\"],[\"트리거\",\"스크롤하여 페이지에 보일 때.\"],[\"반응\",\"'명세서를 쓰고, 만들고, 다듬는다' 텍스트가 범위 중앙에서 시작해 양옆으로 늘어나며 한 글자씩 타이핑됨. 출력되는 동안 텍스트 맨 오른쪽에 글자 높이의 세로 검정 박스(커서)가 있다가 출력이 끝나면 사라짐.\"],[\"수정\",\"· #45와 같은 '다시보기' 버튼 추가\\n· 타이핑 속도를 조금 더 빠르게\"]]},\"47\":{\"t\":\"텍스트 스크램블\",\"r\":[[\"오브젝트\",\"중앙의 'SMART INTERACTION' 텍스트.\"],[\"트리거\",\"스크롤하여 페이지에 보일 때.\"],[\"반응\",\"각 알파벳이 빠르게 랜덤한 알파벳이나 특수기호로 바뀌다가 왼쪽부터 한 글자씩 원래 글자로 확정됨. 총 2초간 진행.\"],[\"조건\",\"'S'는 처음부터 S로 고정되어 변하지 않음.\"],[\"수정\",\"· '다시보기' 버튼 추가\"]]},\"48\":{\"t\":\"바뀐 자리만 굴러가는 숫자\",\"r\":[[\"오브젝트\",\"상단 중앙에 '월간'/'연간'을 고르는 양 끝 반원 탭. '연간' 오른쪽에는 틴트된 초록 프레임에 작은 초록 글씨 '-20%'. 그 아래 세로로 살짝 긴 카드 3장을 가로로 배치. 각 카드는 상단 왼쪽에 플랜명, 아래에 '₩_,___/월'(₩는 살짝 크게, 숫자는 굵고 크게, /월은 회색 보통), 파란 원 불릿 3줄 설명, 그 아래 카드 폭보다 살짝 좁은 버튼. 카드 내용: 베이직 9,900 / 프로젝트 3개·저장공간 5GB·기본 템플릿 / 시작하기, 프로 24,900 / 프로젝트 무제한·저장공간 100GB·버전 기록 / 시작하기, 팀 49,000 / 멤버 10명·저장공간 1TB·권한 관리 / 문의하기. 1·3번 카드는 흰 배경에 회색 버튼, 가운데 카드는 뉴트럴 블랙(아주 약간 푸른 기)에 파란 버튼.\"],[\"트리거\",\"상단에서 '연간'을 탭할 때.\"],[\"반응\",\"금액이 7,900 / 19,900 / 39,000으로 감소. 숫자가 바뀌는 자릿수만 변하며, 금액이 올라갈 때는 숫자가 위로 굴러가며 바뀌고 내려갈 때는 반대 방향.\"],[\"수정\",\"· 숫자가 굴러갈 때 1씩 변하며 돌아가도록 수정\\n· 상단 월간/연간이 차지하는 공간의 균형 조정\\n· 버튼을 사각형에 모서리만 살짝 둥근 형태로 변경\"]]},\"49\":{\"t\":\"틸트 카드\",\"r\":[[\"오브젝트\",\"회색과, 회색에 아주 살짝 노란 기가 섞인 색의 그라데이션 배경을 가진 가로로 살짝 긴 사각형 카드. 중앙에 '기울어지는 카드' 텍스트.\"],[\"트리거\",\"카드에 마우스 커서를 올릴 때.\"],[\"반응\",\"커서가 올라간 부분이 뒤쪽으로 기울어짐.\"],[\"수정\",\"· 마우스가 카드 밖으로 나가면 초기 상태로 복귀\\n· 배경 전체에 톤을 더해 더 어둡게\"]]},\"50\":{\"t\":\"스크롤 스크럽\",\"r\":[[\"오브젝트\",\"범위 대부분을 채우는 흰색 사각형 카드. 카드 안 중앙과 왼쪽 사이에 모서리가 둥근 검정 정사각형 하나.\"],[\"트리거\",\"카드 안에서 스크롤할 때.\"],[\"반응\",\"정사각형이 왼쪽으로 굴러가 function sync(){const y=scrollY;for(const o of W){const win=o.f.contentWindow;if(!win)continue;const max=Math.max(0,o.H-o.f.clientHeight);const v=Math.min(max,Math.max(0,(y-top_(o))/S));if(Math.abs(win.scrollY-v)>0.5)win.scrollTo(0,v)}
 document.getElementById('top').classList.toggle('on',y>240)}
function measure(){let ch=false;for(const o of W){try{const r=o.f.contentDocument.querySelector('[data-root]');if(!r)continue;const h=Math.ceil(r.getBoundingClientRect().height);if(h&&h!==o.H){o.H=h;ch=true}const wh=Math.max((h||0)*S,innerHeight);o.w.style.height=wh+'px'}catch(_){}}if(ch)sync()}
addEventListener('scroll',sync,{passive:true});addEventListener('resize',()=>{layout();measure();sync()});layout();
setInterval(measure,400);W.forEach(o=>o.f.addEventListener('load',()=>{setTimeout(()=>{measure();sync()},300)}));
addEventListener('message',e=>{const d=e.data||{};
 if(d.dcScroll!==undefined){const o=W[d.i];if(!o)return;const y=scrollY,t=top_(o),max=Math.max(0,o.H-o.f.clientHeight);const exp=(y-t)/S;if(exp<0||exp>max)return;if(Math.abs(d.dcScroll-exp)>2)scrollTo(0,t+d.dcScroll*S);return}
 if(d.dcGo){const id=d.dcGo;for(const o of W){try{const el=o.f.contentDocument.getElementById(id);if(el){const r=el.getBoundingClientRect();scrollTo({top:top_(o)+(r.top+o.f.contentWindow.scrollY-16)*S,behavior:'smooth'});return}}catch(_){}}}});
document.getElementById('top').addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));
